server.port=8080

# Application Name
spring.application.name=urban-mobility-backend

# In-Memory H2 Database Profile (Zero local setup required)
spring.datasource.url=jdbc:h2:mem:urban_mobility;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Authentication
app.jwt.secret=UrbanMobilityDemoSecretKeyForJWTAuthenticationChangeMe123456789
app.jwt.expiration-ms=86400000

# JSON Serializer
spring.jackson.serialization.write-dates-as-timestamps=false

# SpringDoc / Swagger OpenAPI 3.0
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Vector Database & RAG Configuration
app.rag.top-k=3
app.rag.similarity-threshold=0.25
