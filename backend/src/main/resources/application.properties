server.port=8080

# Application Name
spring.application.name=urban-mobility-backend

# PostgreSQL Database (Local Primary)
spring.datasource.url=jdbc:postgresql://localhost:5432/urban_mobility
spring.datasource.username=postgres
spring.datasource.password=ENABLES04$
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Authentication
app.jwt.secret=UrbanMobilityDemoSecretKeyForJWTAuthenticationChangeMe123456789
app.jwt.expiration-ms=86400000

# JSON Serializer
spring.jackson.serialization.write-dates-as-timestamps=false

# SpringDoc / Swagger OpenAPI 3.0
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

# Spring Boot Actuator Observability
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Vector Database & RAG Configuration
app.rag.top-k=3
app.rag.similarity-threshold=0.25
app.rag.chunk-size=300
app.rag.chunk-overlap=50
# Optional external LLM API Key (if provided, otherwise built-in smart semantic synthesizer is used)
# app.llm.gemini-api-key=
# app.llm.openai-api-key=x