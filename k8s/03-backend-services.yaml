# ----------------------------------------------------------------------------
# FastAPI Centralized API Gateway & RAG Service (CO3, CO5)
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  namespace: urban-mobility
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: urban-mobility/gateway:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: mobility-config
            - secretRef:
                name: mobility-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: urban-mobility
spec:
  selector:
    app: gateway
  ports:
    - port: 8000
      targetPort: 8000
---
# ----------------------------------------------------------------------------
# Spring Boot Transit & Fleet Microservice (CO4, CO5)
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transit-deployment
  namespace: urban-mobility
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transit-service
  template:
    metadata:
      labels:
        app: transit-service
    spec:
      containers:
        - name: transit-service
          image: urban-mobility/transit-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres-service:5432/urban_mobility"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mobility-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: transit-service
  namespace: urban-mobility
spec:
  selector:
    app: transit-service
  ports:
    - port: 8080
      targetPort: 8080
---
# ----------------------------------------------------------------------------
# Node.js Express Telemetry & Socket.io Microservice (CO4, CO5)
# ----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-deployment
  namespace: urban-mobility
spec:
  replicas: 2
  selector:
    matchLabels:
      app: telemetry-service
  template:
    metadata:
      labels:
        app: telemetry-service
    spec:
      containers:
        - name: telemetry-service
          image: urban-mobility/telemetry-service:latest
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGO_URI
              value: "mongodb://mongo-service:27017/urban_mobility_nosql"
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT
              value: "6379"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-service
  namespace: urban-mobility
spec:
  selector:
    app: telemetry-service
  ports:
    - port: 5000
      targetPort: 5000
