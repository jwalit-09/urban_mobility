apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: urban-mobility
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: urban-mobility/frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: urban-mobility
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
