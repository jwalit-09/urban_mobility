apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mobility-ingress
  namespace: urban-mobility
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  rules:
    - http:
        paths:
          # API Gateway & Backend Endpoints
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8000
          # Spring Boot Actuator Observability
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: transit-service
                port:
                  number: 8080
          # Socket.io Real-time stream
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: telemetry-service
                port:
                  number: 5000
          # React Frontend Dashboard
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
