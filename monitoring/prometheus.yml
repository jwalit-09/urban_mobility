global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # 1. Prometheus Self-Monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # 2. FastAPI API Gateway & Backend
  - job_name: "fastapi-gateway"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["gateway:8000"]

  # 3. Spring Boot Transit & Fleet Microservice (Actuator Prometheus Endpoint)
  - job_name: "spring-boot-transit"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["transit-service:8080"]

  # 4. Node.js Express Telemetry Microservice
  - job_name: "node-telemetry-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["telemetry-service:5000"]
